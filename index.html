<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Juost</title>
<style>
  :root { --bg: #0b0b12; --fg: #f5f5f7; --accent: #40c4ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .logo { font-size: clamp(48px, 18vw, 140px); font-weight: 900; letter-spacing: -0.03em; }
  .tagline { opacity: 0.6; font-size: clamp(14px, 4vw, 22px); margin-top: 8px; margin-bottom: 10vh; }

  .buttons { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 320px; }
  .btn {
    display: block; width: 100%; padding: 20px; border-radius: 16px;
    font-size: clamp(18px, 5vw, 24px); font-weight: 700;
    text-decoration: none; text-align: center;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-player {
    background: var(--accent); color: #05060a;
    box-shadow: 0 4px 24px rgba(64, 196, 255, 0.3);
  }
  .btn-host {
    background: #1a1a24; color: var(--fg);
    border: 2px solid #333;
  }
  .btn-host:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="logo">JUOST</div>
  <div class="tagline">phones instead of joysticks</div>

  <div class="buttons">
    <a href="/player.html" class="btn btn-player">Join as Player</a>
    <a href="/host.html" class="btn btn-host">Host a Game</a>
  </div>
</body>
</html>
