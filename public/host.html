<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juost — Host</title>
<link rel="stylesheet" href="host.css">
</head>
<body>
  <h1 class="logo">JUOST</h1>
  <div class="meta-row">
    <div class="room-code" id="roomCode">----</div>
    <div class="round-badge" id="roundBadge">Round 0</div>
    <div class="score-badge" id="scoreBadge">First to 3</div>
  </div>
  <div class="join-url" id="joinUrl">Loading...</div>
  <div id="statusBanner"></div>

  <div id="players"><span class="empty-hint">Waiting for players to join…</span></div>

  <div id="countdownDisplay"></div>

  <div id="winnerDisplay">
    <div class="label">ROUND WINNER</div>
    <div class="name" id="winnerName"></div>
  </div>

  <div id="matchDisplay">
    <div class="label">MATCH CHAMPION</div>
    <div class="name" id="matchName"></div>
  </div>

  <div id="musicPanel">
    <div class="bar-label" id="musicBarLabel">♩ Music Tempo — controls movement sensitivity</div>
    <div id="tempoBar"><div id="tempoFill"></div></div>
    <div id="tempoLabel">1.0x — slow = strict, fast = lenient</div>
  </div>

  <div id="visualizer"><canvas id="vizCanvas"></canvas></div>

  <div id="controls">
    <div class="target-wrap">
      <label for="targetScore">First to</label>
      <input id="targetScore" type="number" min="1" max="20" value="3">
    </div>
    <select id="tempoMode">
      <option value="accelerating">Accelerating</option>
      <option value="random">Random Shifts</option>
      <option value="steady">Steady (no music)</option>
    </select>
    <button id="startBtn" type="button" disabled>Start Round</button>
    <button id="newMatchBtn" type="button" class="secondary" style="display:none;">New Match</button>
    <button id="resetBtn" type="button" class="secondary">Back to Lobby</button>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="host.js"></script>
</body>
</html>
