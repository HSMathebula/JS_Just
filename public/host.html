<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juost — Host</title>
<style>
  :root { --bg: #0b0b12; --fg: #f5f5f7; --accent: #40c4ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #16161f, #0b0b12 70%);
    color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 40px 24px;
  }
  h1.logo { font-size: 6vw; font-weight: 900; letter-spacing: -0.03em; margin: 0; }
  .join-url { font-size: 1.6vw; opacity: 0.6; margin-top: 6px; margin-bottom: 40px; letter-spacing: 0.02em; }

  #players {
    display: flex; flex-wrap: wrap; gap: 18px; justify-content: center;
    max-width: 1100px; margin-bottom: 50px;
  }
  .player-chip {
    padding: 16px 26px; border-radius: 16px; font-size: 2vw; font-weight: 700;
    background: #1a1a24; border: 3px solid transparent; transition: all 0.2s ease;
  }
  .player-chip.out { opacity: 0.25; text-decoration: line-through; transform: scale(0.9); }

  #controls { display: flex; gap: 20px; margin-top: 10px; }
  button {
    font-size: 1.8vw; font-weight: 700; padding: 18px 44px;
    border-radius: 999px; border: none; background: var(--accent); color: #05060a; cursor: pointer;
  }
  button.secondary { background: #2a2a36; color: var(--fg); }
  button:disabled { opacity: 0.35; cursor: default; }

  #countdownDisplay {
    font-size: 22vw; font-weight: 900; display: none;
  }

  #winnerDisplay { display: none; text-align: center; }
  #winnerDisplay .label { font-size: 2vw; opacity: 0.6; }
  #winnerDisplay .name { font-size: 8vw; font-weight: 900; }

  .empty-hint { opacity: 0.4; font-size: 1.6vw; }
  #sensBar { width: 60vw; height: 10px; background: #222; border-radius: 6px; overflow: hidden; margin-top: 30px; display:none;}
  #sensFill { height: 100%; background: linear-gradient(90deg, #40c4ff, #ff5252); width: 20%; transition: width 0.3s ease; }
</style>
</head>
<body>
  <h1 class="logo">JUOST</h1>
  <div class="join-url" id="joinUrl">Players: open this server's address on their phones to join</div>

  <div id="players"><span class="empty-hint">Waiting for players to join…</span></div>

  <div id="countdownDisplay"></div>

  <div id="winnerDisplay">
    <div class="label">WINNER</div>
    <div class="name" id="winnerName"></div>
  </div>

  <div id="sensBar"><div id="sensFill"></div></div>

  <div id="controls">
    <button id="startBtn" disabled>Start Round</button>
    <button id="resetBtn" class="secondary">Reset Lobby</button>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit('hostJoin');

document.getElementById('joinUrl').textContent = 'Players join at: ' + location.origin;

const playersEl = document.getElementById('players');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const countdownDisplay = document.getElementById('countdownDisplay');
const winnerDisplay = document.getElementById('winnerDisplay');
const winnerName = document.getElementById('winnerName');
const sensBar = document.getElementById('sensBar');
const sensFill = document.getElementById('sensFill');

let currentState = null;

function render(state) {
  currentState = state;
  playersEl.innerHTML = '';
  if (state.players.length === 0) {
    playersEl.innerHTML = '<span class="empty-hint">Waiting for players to join…</span>';
  } else {
    state.players.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'player-chip' + (p.alive ? '' : ' out');
      chip.style.borderColor = p.color;
      chip.style.color = p.color;
      chip.textContent = p.name + (p.alive ? '' : ' ☠');
      playersEl.appendChild(chip);
    });
  }
  startBtn.disabled = state.players.length < 1 || state.gameState === 'playing' || state.gameState === 'countdown';

  if (state.gameState === 'lobby') {
    countdownDisplay.style.display = 'none';
    winnerDisplay.style.display = 'none';
    sensBar.style.display = 'none';
    playersEl.style.display = 'flex';
  } else if (state.gameState === 'playing') {
    countdownDisplay.style.display = 'none';
    winnerDisplay.style.display = 'none';
    sensBar.style.display = 'block';
    const pct = Math.min(100, ((state.sensitivity - 0.6) / (2.2 - 0.6)) * 100);
    sensFill.style.width = pct + '%';
  }
}

socket.on('state', render);

socket.on('countdown', (n) => {
  playersEl.style.display = 'none';
  countdownDisplay.style.display = 'block';
  countdownDisplay.textContent = n;
});

socket.on('go', () => {
  countdownDisplay.style.display = 'none';
  playersEl.style.display = 'flex';
});

socket.on('roundOver', (data) => {
  winnerDisplay.style.display = 'block';
  sensBar.style.display = 'none';
  winnerName.textContent = data.winner ? data.winner.name : 'No one (empty lobby)';
  winnerName.style.color = data.winner ? data.winner.color : '#fff';
});

startBtn.addEventListener('click', () => {
  winnerDisplay.style.display = 'none';
  socket.emit('startRound');
});

resetBtn.addEventListener('click', () => {
  socket.emit('resetLobby');
});
</script>
</body>
</html>
