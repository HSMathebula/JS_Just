<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Juost — Player</title>
<style>
  :root { --bg: #0b0b12; --fg: #f5f5f7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  #app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    transition: background-color 0.15s ease;
  }
  .logo { font-size: 15vw; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
  .sub { opacity: 0.6; font-size: 4.5vw; margin-bottom: 6vh; }

  input[type=text] {
    font-size: 6vw; padding: 14px 18px; border-radius: 14px;
    border: 2px solid #333; background: #1a1a24; color: var(--fg);
    width: 80%; max-width: 320px; text-align: center; margin-bottom: 14px;
    text-transform: uppercase;
  }
  input#nameInput { text-transform: none; }
  button {
    font-size: 5.5vw; font-weight: 700; padding: 16px 40px;
    border-radius: 999px; border: none; background: #40c4ff; color: #05060a;
    cursor: pointer; transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }

  .screen { display: none; height: 100%; width: 100%; flex-direction: column; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  #statusScreen .status-word {
    font-size: 18vw; font-weight: 900; letter-spacing: -0.02em;
  }
  #statusScreen .status-sub { font-size: 5vw; opacity: 0.7; margin-top: 8px; }
  #playerNameTag { font-size: 6vw; font-weight: 700; margin-top: 24px; opacity: 0.9; }
  #roomCodeDisplay { font-size: 4vw; opacity: 0.5; margin-top: 8px; font-family: monospace; }

  #countdownScreen {
    font-size: 40vw; font-weight: 900;
  }

  .tempo-indicator {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 3.5vw; opacity: 0.5; font-family: monospace;
  }

  .error-msg {
    color: #ff5252; font-size: 4vw; margin-top: 12px; min-height: 1.5em;
  }

  .pulse {
    animation: pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Join Screen -->
  <div id="joinScreen" class="screen active">
    <div class="logo">JUOST</div>
    <div class="sub">your phone is the controller</div>
    <input id="codeInput" type="text" placeholder="Room code" maxlength="4" autocomplete="off">
    <input id="nameInput" type="text" placeholder="Your name" maxlength="16" autocomplete="off">
    <br>
    <button id="joinBtn" type="button">Join Game</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Lobby Screen -->
  <div id="lobbyScreen" class="screen">
    <div class="logo" style="font-size:10vw;">You're in!</div>
    <div id="playerNameTag"></div>
    <div id="roomCodeDisplay"></div>
    <div class="sub" style="margin-top:24px;">Waiting for host to start…</div>
  </div>

  <!-- Countdown Screen -->
  <div id="countdownScreen" class="screen"></div>

  <!-- Playing Screen -->
  <div id="statusScreen" class="screen">
    <div class="status-word" id="statusWord">ALIVE</div>
    <div class="status-sub" id="statusSub">hold steady</div>
    <div class="tempo-indicator" id="tempoIndicator">♩ tempo: 1.0x</div>
  </div>

  <!-- Kicked / Room closed -->
  <div id="disconnectedScreen" class="screen">
    <div class="logo" style="font-size:10vw;">😵</div>
    <div class="sub">Disconnected from room</div>
    <button onclick="location.reload()">Rejoin</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ reconnection: true, reconnectionAttempts: 5 });

const app = document.getElementById('app');
const screens = document.querySelectorAll('.screen');
const joinScreen = document.getElementById('joinScreen');
const lobbyScreen = document.getElementById('lobbyScreen');
const countdownScreen = document.getElementById('countdownScreen');
const statusScreen = document.getElementById('statusScreen');
const disconnectedScreen = document.getElementById('disconnectedScreen');
const statusWord = document.getElementById('statusWord');
const statusSub = document.getElementById('statusSub');
const tempoIndicator = document.getElementById('tempoIndicator');
const codeInput = document.getElementById('codeInput');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const playerNameTag = document.getElementById('playerNameTag');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const errorMsg = document.getElementById('errorMsg');

let connected = false;
let myName = '';
let myColor = '#40c4ff';
let alive = true;
let motionActive = false;
let sensitivity = 0.5;
let tempo = 1.0;

// Base acceleration magnitude threshold
const BASE_THRESHOLD = 24;

socket.on('connect', () => {
  console.log('Connected to server');
  connected = true;
});

socket.on('disconnect', () => {
  connected = false;
});

function showScreen(id) {
  screens.forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function requestMotionPermission(cb) {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(state => {
      cb(state === 'granted');
    }).catch(() => cb(false));
  } else {
    cb(true);
  }
}

// ---- Join flow ----
joinBtn.addEventListener('click', (e) => {
  e.preventDefault();
  const code = codeInput.value.trim().toUpperCase();
  myName = nameInput.value.trim() || 'Player';
  errorMsg.textContent = '';

  if (!connected) {
    errorMsg.textContent = 'Not connected to server. Make sure it is running.';
    return;
  }

  if (code.length !== 4) {
    errorMsg.textContent = 'Enter the 4-letter room code from the host screen.';
    return;
  }

  requestMotionPermission((granted) => {
    if (!granted) {
      errorMsg.textContent = 'Motion sensor access is required to play.';
      return;
    }
    console.log('Emitting joinRoom:', code, myName);
    socket.emit('joinRoom', { code: code, name: myName });
  });
});

// Allow Enter key to submit
[codeInput, nameInput].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinBtn.click();
  });
});

// ---- Socket events ----
socket.on('joined', (data) => {
  myColor = data.color;
  playerNameTag.textContent = data.name;
  playerNameTag.style.color = data.color;
  roomCodeDisplay.textContent = 'Room: ' + data.roomCode;
  app.style.backgroundColor = '#0b0b12';
  showScreen('lobbyScreen');
});

socket.on('joinError', (data) => {
  errorMsg.textContent = data.message;
});

socket.on('countdown', (n) => {
  showScreen('countdownScreen');
  countdownScreen.textContent = n;
});

socket.on('go', () => {
  alive = true;
  sensitivity = 0.5;
  tempo = 1.0;
  statusWord.textContent = 'ALIVE';
  statusWord.style.color = myColor;
  statusSub.textContent = 'hold steady — move with the beat';
  tempoIndicator.textContent = '♩ tempo: 1.0x';
  app.style.backgroundColor = '#0b0b12';
  showScreen('statusScreen');
  startMotionWatch();
});

socket.on('tempoUpdate', (data) => {
  tempo = data.tempo;
  sensitivity = data.sensitivity;
  tempoIndicator.textContent = '♩ tempo: ' + tempo.toFixed(1) + 'x';

  // Visual feedback — color shifts with tempo
  if (alive) {
    const hue = Math.round(200 - (tempo - 0.5) * 80); // blue -> orange as tempo rises
    statusSub.textContent = tempo < 1.0 ? '🧊 slow — freeze!' : tempo > 1.5 ? '🔥 fast — move freely!' : 'hold steady';
  }
});

socket.on('playerOut', (data) => {
  if (data.id === socket.id) {
    // Already handled locally, but confirm
  }
});

socket.on('backToLobby', () => {
  alive = true;
  stopMotionWatch();
  app.style.backgroundColor = '#0b0b12';
  showScreen('lobbyScreen');
});

socket.on('roundOver', (data) => {
  stopMotionWatch();
  if (alive) {
    statusWord.textContent = '🏆 WIN!';
    statusWord.style.color = '#ffd740';
    statusSub.textContent = 'you survived!';
  }
});

socket.on('kicked', () => {
  stopMotionWatch();
  showScreen('disconnectedScreen');
});

socket.on('roomClosed', () => {
  stopMotionWatch();
  showScreen('disconnectedScreen');
});

// ---- Motion detection ----
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function startMotionWatch() {
  if (motionActive) return;
  motionActive = true;
  window.addEventListener('devicemotion', onMotion);
}

function stopMotionWatch() {
  motionActive = false;
  window.removeEventListener('devicemotion', onMotion);
}

function onMotion(e) {
  if (!alive) return;
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc) return;
  const mag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);

  // Threshold scales INVERSELY with sensitivity:
  // High sensitivity (fast tempo) = high threshold = can move more
  // Low sensitivity (slow tempo) = low threshold = must be still
  const threshold = BASE_THRESHOLD * sensitivity;

  // Warning zone — visual + haptic feedback
  if (mag > threshold * 0.65 && mag <= threshold) {
    app.style.backgroundColor = '#3a1a1a';
    vibrate(30);
    setTimeout(() => { if (alive) app.style.backgroundColor = '#0b0b12'; }, 100);
  }

  // Elimination
  if (mag > threshold) {
    alive = false;
    statusWord.textContent = 'OUT';
    statusWord.style.color = '#ff5252';
    statusSub.textContent = 'you moved too much!';
    tempoIndicator.textContent = '';
    app.style.backgroundColor = '#210505';
    vibrate([80, 60, 200]);
    stopMotionWatch();
    socket.emit('hit');
  }
}
</script>
</body>
</html>
