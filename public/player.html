<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Juost — Player</title>
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="reconnectBanner">Reconnecting…</div>
<div id="app">

  <div id="joinScreen" class="screen active">
    <div class="logo">JUOST</div>
    <div class="sub">your phone is the controller</div>
    <input id="codeInput" type="text" placeholder="Room code" maxlength="4" autocomplete="off" autocapitalize="characters">
    <input id="nameInput" type="text" placeholder="Your name" maxlength="16" autocomplete="off">
    <br>
    <button id="joinBtn" type="button">Join Game</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="hint-msg" id="secureHint"></div>
    <a class="home-link" href="../index.html">← Home</a>
  </div>

  <div id="lobbyScreen" class="screen">
    <div class="logo" style="font-size:10vw;">You're in!</div>
    <div id="playerNameTag"></div>
    <div id="roomCodeDisplay"></div>
    <div id="roundInfo"></div>
    <div class="sub" style="margin-top:24px;">Waiting for host to start…</div>
  </div>

  <div id="countdownScreen" class="screen"></div>

  <div id="statusScreen" class="screen">
    <div class="status-word" id="statusWord">ALIVE</div>
    <div class="status-sub" id="statusSub">hold steady</div>
    <button id="tapOutBtn" class="tap-out" type="button" style="display:none;">Tap to move</button>
    <div class="tempo-indicator" id="tempoIndicator">♩ tempo: 1.0x</div>
  </div>

  <div id="disconnectedScreen" class="screen">
    <div class="logo" style="font-size:10vw;">Disconnected</div>
    <div class="sub" id="disconnectReason">Disconnected from room</div>
    <button type="button" onclick="location.reload()">Rejoin</button>
    <a class="home-link" href="../index.html">← Home</a>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="player.js"></script>
</body>
</html>
